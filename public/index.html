<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Raider.IO Teams</title>

  <style>
    :root {
      color-scheme: dark;

      --background: #08090c;
      --surface: rgba(255, 255, 255, 0.045);
      --surface-hover: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f5f5f7;
      --muted: #8b8d98;
      --accent: #9b7cff;
      --accent-bright: #b79cff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;

      background:
        radial-gradient(circle at 20% 0%,
          rgba(120, 80, 255, 0.12),
          transparent 35%),
        radial-gradient(circle at 80% 10%,
          rgba(0, 180, 255, 0.08),
          transparent 30%),
        var(--background);

      color: var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      padding: 40px;
    }

    .header {
      max-width: 1600px;
      margin: 0 auto 32px;
    }

    .eyebrow {
      margin-bottom: 8px;

      color: var(--accent-bright);

      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size: clamp(28px, 4vw, 42px);
      font-weight: 750;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin-top: 8px;

      color: var(--muted);

      font-size: 15px;
    }

    #grid {
      max-width: 1600px;
      margin: 0 auto;

      display: grid;

      grid-template-columns:
        repeat(auto-fit,
          minmax(320px, 1fr));

      gap: 18px;
    }

    .team-card {
      position: relative;

      overflow: hidden;
      cursor: pointer;
      min-height: 240px;

      padding: 26px;

      background:
        linear-gradient(145deg,
          rgba(255, 255, 255, 0.075),
          rgba(255, 255, 255, 0.025));

      border: 1px solid var(--border);
      border-radius: 18px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);

      backdrop-filter: blur(20px);

      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background 180ms ease;
    }

    .team-card::before {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      top: -100px;
      right: -70px;

      background: var(--accent);

      opacity: 0.12;

      filter: blur(50px);

      pointer-events: none;
    }

    .team-card:hover {
      transform: translateY(-4px);

      background: var(--surface-hover);

      border-color:
        rgba(155, 124, 255, 0.28);
    }

    .team-header {
      position: relative;

      display: flex;
      align-items: center;

      gap: 14px;
    }

    .team-icon {
      display: flex;

      width: 46px;
      height: 46px;

      flex-shrink: 0;

      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background:
        linear-gradient(135deg,
          var(--accent),
          #5d4bc4);

      box-shadow:
        0 8px 25px rgba(100, 70, 255, 0.25);

      font-size: 20px;
      font-weight: 800;
    }

    .team-name {
      min-width: 0;

      font-size: 18px;
      font-weight: 700;

      letter-spacing: -0.02em;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-region {
      margin-top: 3px;

      color: var(--muted);

      font-size: 12px;
    }

    .score-section {
      position: relative;

      margin-top: 30px;
    }

    .score-label {
      color: var(--muted);

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .score {
      margin-top: 4px;

      font-size: 48px;
      line-height: 1;

      font-weight: 800;

      letter-spacing: -0.055em;

      background:
        linear-gradient(135deg,
          #ffffff,
          #bcaaff);

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .season {
      margin-top: 10px;

      color: var(--muted);

      font-size: 13px;
    }

    .status {
      position: absolute;

      top: 24px;
      right: 24px;

      display: flex;
      align-items: center;

      gap: 7px;

      color: #8fdaae;

      font-size: 11px;
      font-weight: 600;
    }

    .status-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #69d391;

      box-shadow:
        0 0 10px rgba(105, 211, 145, 0.8);
    }

    .loading {
      min-height: 240px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--muted);

      animation: pulse 1.5s infinite;
    }

    .error {
      border-color:
        rgba(255, 80, 100, 0.25);
    }

    .error .score {
      font-size: 16px;
      color: #ff7182;
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .refresh-button {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 10px 16px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: rgba(255, 255, 255, 0.055);
      color: var(--text);

      font: inherit;
      font-size: 13px;
      font-weight: 650;

      cursor: pointer;

      transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .refresh-button:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(155, 124, 255, 0.35);
      transform: translateY(-1px);
    }

    .refresh-button:active {
      transform: translateY(0);
    }

    .refresh-icon {
      display: inline-block;

      font-size: 18px;
      line-height: 1;

      transition: transform 500ms ease;
    }

    .refresh-button.loading .refresh-icon {
      animation: spin 700ms linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      .header-top {
        align-items: stretch;
        flex-direction: column;
      }

      .refresh-button {
        align-self: flex-start;
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
      }

      #grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-top">
      <div>
        <div class="eyebrow">
          Mythic+
        </div>

        <h1>
          Team Rankings
        </h1>

        <div class="subtitle">
          Current Raider.IO team scores
        </div>
      </div>

      <button id="refresh-button" class="refresh-button">
        <span class="refresh-icon">↻</span>
        Refresh
      </button>
    </div>
  </header>

  <main id="grid"></main>

  <script>
    const links = [
      "https://raider.io/teams/us/red-bird-only",
      "https://raider.io/teams/us/failure-is-bis",
      "https://raider.io/teams/us/bricked-minifigs",
      "https://raider.io/teams/us/dont-gas-light-me",
      "https://raider.io/teams/us/spice-squad",
      "https://raider.io/teams/us/no-no-square",
      "https://raider.io/teams/us/monsters",
      "https://raider.io/teams/us/timed-in-spirit",
      "https://raider.io/teams/us/serial-wipers",
      "https://raider.io/teams/us/pull-hub",
      "https://raider.io/teams/us/hold-my-bear",
      "https://raider.io/teams/us/the-last-percent",
      // Add more teams here:
      // "https://raider.io/teams/us/team-two",
      // "https://raider.io/teams/us/team-three",
    ];

    const grid = document.getElementById("grid");

    function createLoadingCard() {
      const card = document.createElement("div");

      card.className = "team-card loading";

      card.innerHTML = `
                Loading team...
            `;

      return card;
    }

    function createTeamCard(data) {
      const card = document.createElement("article");
      const url = data.url;


      card.onclick = () => {
        window.open(url, "_blank");
      };

      card.className = "team-card";


      const initials = data.name
        .replace(/\(.*?\)/g, "")
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(word => word[0])
        .join("")
        .toUpperCase();

      card.innerHTML = `
                <div class="status">
                    <span class="status-dot"></span>
                    Live
                </div>

                <div class="team-header">

                    <div class="team-icon">
                        ${initials}
                    </div>

                    <div>
                        <div class="team-name">
                            ${data.name}
                        </div>

                        <div class="team-region">
                            Raider.IO Team
                        </div>
                    </div>

                </div>

                <div class="score-section">

                    <div class="score-label">
                        Mythic+ Score
                    </div>

                    <div class="score">
                        ${data.score}
                    </div>

                    <div class="season">
                        MN Season 2
                    </div>

                </div>
            `;

      return card;
    }

    const refreshButton = document.getElementById("refresh-button");


    async function loadTeam(url) {
      const loadingCard = createLoadingCard();

      grid.appendChild(loadingCard);

      try {
        const response = await fetch(
          "/extract?url=" +
          encodeURIComponent(url)
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || `Failed to load team`
          );
        }

        const teamCard = createTeamCard(data);

        loadingCard.replaceWith(teamCard);

      } catch (error) {
        loadingCard.className =
          "team-card error";

        loadingCard.innerHTML = `
                    <div class="score-label">
                        Error
                    </div>

                    <div class="score">
                        Failed to load
                    </div>

                    <div class="season">
                        ${error.message}
                    </div>
                `;
      }
    }


    async function refreshTeams() {
      refreshButton.classList.add("loading");
      refreshButton.disabled = true;

      grid.innerHTML = "";

      const promises = links.map(url => loadTeam(url));

      await Promise.all(promises);

      refreshButton.classList.remove("loading");
      refreshButton.disabled = false;
    }

    refreshButton.addEventListener(
      "click",
      refreshTeams
    );

    refreshTeams();

  </script>

</body>

</html>
